name: Build Kentstrapper OrcaSlicer (Windows)

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/build_kentstrapper_windows.yml'

  workflow_dispatch:
    inputs:
      create-release:
        description: 'Create a GitHub Release after build'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build_windows:
    name: Build Kentstrapper OrcaSlicer (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Kentstrapper patches
        uses: actions/checkout@v4
        with:
          path: kentstrapper-patches

      - name: Clone OrcaSlicer upstream
        run: git clone --depth 1 https://github.com/SoftFever/OrcaSlicer.git orcaslicer-source

      - name: Get OrcaSlicer commit SHA (for cache key)
        id: orca_sha
        working-directory: orcaslicer-source
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          echo "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Cache OrcaSlicer dependencies
        id: cache_deps
        uses: actions/cache@v4
        with:
          path: orcaslicer-source/deps/build/OrcaSlicer_dep
          key: windows-orcaslicer-deps-${{ steps.orca_sha.outputs.sha }}

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.3.0"
          useLocalCache: true
          useCloudCache: true

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Build dependencies (only if not cached)
        if: steps.cache_deps.outputs.cache-hit != 'true'
        working-directory: orcaslicer-source
        run: .\build_release_vs.bat deps

      - name: Apply Kentstrapper branding
        shell: pwsh
        run: |
          $src = "${{ github.workspace }}\kentstrapper-patches\src"
          $dst = "${{ github.workspace }}\orcaslicer-source\src"
          Get-ChildItem -Path $src -Recurse -File | ForEach-Object {
            $relative = $_.FullName.Substring($src.Length)
            $target = Join-Path $dst $relative
            $targetDir = Split-Path $target -Parent
            if (-not (Test-Path $targetDir)) { New-Item -ItemType Directory -Path $targetDir -Force | Out-Null }
            Copy-Item $_.FullName -Destination $target -Force
            Write-Host "Patched: $relative"
          }

      - name: Install NSIS
        run: choco install nsis -y

      - name: Get version
        id: get_ver
        working-directory: orcaslicer-source
        shell: pwsh
        run: |
          $versionContent = Get-Content version.inc -Raw
          if ($versionContent -match 'set\(SoftFever_VERSION "(.*?)"\)') { $ver = $matches[1] }
          $ver = "V$ver-Kentstrapper"
          echo "ver=$ver" >> $env:GITHUB_ENV
          echo "date=$(Get-Date -Format 'yyyyMMdd')" >> $env:GITHUB_ENV

      - name: Build OrcaSlicer
        working-directory: orcaslicer-source
        env:
          WindowsSdkDir: 'C:\Program Files (x86)\Windows Kits\10\'
          WindowsSDKVersion: '10.0.26100.0\'
        run: .\build_release_vs.bat slicer

      - name: Create installer
        working-directory: orcaslicer-source/build
        run: cpack -G NSIS

      - name: Pack portable zip
        working-directory: orcaslicer-source/build
        shell: cmd
        run: '"C:/Program Files/7-Zip/7z.exe" a -tzip KentrapperSlicer_Windows_${{ env.ver }}_portable.zip OrcaSlicer'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: KentrapperSlicer_Windows_${{ env.ver }}_installer
          path: orcaslicer-source/build/OrcaSlicer*.exe

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: KentrapperSlicer_Windows_${{ env.ver }}_portable
          path: orcaslicer-source/build/KentrapperSlicer_Windows_${{ env.ver }}_portable.zip

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.create-release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kentstrapper-${{ env.ver }}-${{ env.date }}
          name: "Kentstrapper OrcaSlicer ${{ env.ver }} (${{ env.date }})"
          body: |
            ## Kentstrapper OrcaSlicer - Windows Build

            OrcaSlicer rebranded con i colori aziendali Kentstrapper (nero & arancione #FF8800).

            ### Download
            - **Installer** (.exe) - consigliato, installa automaticamente
            - **Portable** (.zip) - nessuna installazione, decomprimi e avvia

            ### Modifiche rispetto a OrcaSlicer ufficiale
            - Colore accent: teal #009688 -> arancione Kentstrapper #FF8800
            - Pulsanti confirm/hover aggiornati
            - Bordi input focus aggiornati
            - Mappatura colori dark mode aggiornata
          draft: false
          prerelease: false
          files: |
            orcaslicer-source/build/OrcaSlicer*.exe
            orcaslicer-source/build/KentrapperSlicer_Windows_${{ env.ver }}_portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
