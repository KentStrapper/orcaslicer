name: Build Kentstrapper OrcaSlicer (Windows)

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'branding/**'
      - 'profiles/**'
      - '.github/workflows/build_kentstrapper_windows.yml'

  workflow_dispatch:
    inputs:
      create-release:
        description: 'Create a GitHub Release after build'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build_windows:
    name: Build Kentstrapper OrcaSlicer (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Kentstrapper patches
        uses: actions/checkout@v4
        with:
          path: kentstrapper-patches

      - name: Clone OrcaSlicer v2.3.2 (stable)
        run: git clone --depth 1 --branch v2.3.2 https://github.com/SoftFever/OrcaSlicer.git orcaslicer-source

      - name: Get OrcaSlicer commit SHA (for cache key)
        id: orca_sha
        working-directory: orcaslicer-source
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          echo "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Cache OrcaSlicer dependencies
        id: cache_deps
        uses: actions/cache@v4
        with:
          path: orcaslicer-source/deps/build/OrcaSlicer_dep
          key: windows-orcaslicer-deps-${{ steps.orca_sha.outputs.sha }}

      - name: Install CMake 3.28.3 (OrcaSlicer v2.3.2 incompatible with cmake 4.x)
        shell: pwsh
        run: |
          # Always install cmake 3.28.3 and prepend it to PATH unconditionally.
          # windows-latest now ships cmake 4.x which breaks OrcaSlicer v2.3.2.
          $zip = "$env:RUNNER_TEMP\cmake-3.28.3.zip"
          $out = "$env:RUNNER_TEMP\cmake-3.28.3"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Write-Host "Downloading cmake-3.28.3-windows-x86_64.zip..."
          Invoke-WebRequest `
            -Uri "https://github.com/Kitware/CMake/releases/download/v3.28.3/cmake-3.28.3-windows-x86_64.zip" `
            -OutFile $zip -UseBasicParsing
          Expand-Archive $zip $out -Force
          $bin = (Get-ChildItem $out -Directory | Select-Object -First 1).FullName + "\bin"
          Write-Host "cmake 3.28.3 installed to: $bin"
          echo $bin >> $env:GITHUB_PATH

      - name: Verify CMake version is 3.x
        shell: pwsh
        run: |
          $ver = cmake --version 2>&1 | Select-Object -First 1
          Write-Host "Active cmake: $ver"
          if ($ver -notmatch 'cmake version 3\.') {
            Write-Host "ERROR: cmake 3.x required, got: $ver"
            exit 1
          }
          Write-Host "cmake 3.x confirmed OK"

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      # ── Always-on diagnostics: captures cmake/msbuild state before build ────
      - name: Diagnose build environment
        if: always()
        shell: pwsh
        run: |
          $cmake_ver   = cmake --version 2>&1 | Select-Object -First 1
          $msbuild_ver = msbuild -version 2>&1 | Select-Object -First 1
          $python_ver  = python --version 2>&1
          $src_exists  = Test-Path orcaslicer-source
          $src_ok      = Test-Path "orcaslicer-source\src\libslic3r\Support\TreeSupport.cpp"
          @"
          ## Build Environment Diagnostics
          | Key | Value |
          |-----|-------|
          | cmake | $cmake_ver |
          | msbuild | $msbuild_ver |
          | python | $python_ver |
          | orcaslicer-source | $src_exists |
          | TreeSupport.cpp | $src_ok |
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Write-Host "cmake:    $cmake_ver"
          Write-Host "msbuild:  $msbuild_ver"
          Write-Host "python:   $python_ver"
          Write-Host "src:      $src_exists / TreeSupport: $src_ok"

      - name: Build dependencies (only if not cached)
        if: steps.cache_deps.outputs.cache-hit != 'true'
        working-directory: orcaslicer-source
        run: .\build_release_vs.bat deps

      # ── PATCH 1: Copy patched C++ source files ────────────────────────────
      - name: Apply Kentstrapper patched source files
        shell: pwsh
        run: |
          $srcDir = "kentstrapper-patches\src"
          if (Test-Path $srcDir) {
            Write-Host "Copying patched source files..."
            $files = Get-ChildItem -Path $srcDir -Recurse -File
            foreach ($f in $files) {
              $rel     = $f.FullName.Substring((Resolve-Path $srcDir).Path.Length + 1)
              $dest    = Join-Path "orcaslicer-source\src" $rel
              $destDir = Split-Path $dest -Parent
              New-Item -ItemType Directory -Path $destDir -Force | Out-Null
              Copy-Item $f.FullName $dest -Force
              Write-Host "  -> src\$rel"
            }
          } else {
            Write-Host "No src/ patches, skipping."
          }

      # ── PATCH 2: Global color replacement ────────────────────────────────
      - name: Apply Kentstrapper branding - global color replacement
        shell: pwsh
        run: |
          python kentstrapper-patches\scripts\patch_colors.py orcaslicer-source

      # ── PATCH 2b: Patch splash screen in GUI_App.cpp ──────────────────────
      - name: Patch splash screen (GUI_App.cpp)
        shell: pwsh
        run: |
          python kentstrapper-patches\scripts\patch_splash.py orcaslicer-source

      # ── PATCH 2c: Mixed support (tree + normal per region) ────────────────
      - name: Apply mixed-support patches (TreeSupport + PrintObject)
        shell: pwsh
        run: |
          python kentstrapper-patches\scripts\patch_mixed_support.py orcaslicer-source

      # ── PATCH 3: Verify colors + full teal scan ───────────────────────────
      - name: Verify color replacement
        shell: pwsh
        run: |
          $failed = $false
          $tealPatterns = @("009688","BFE1DE","26A69A","52c7b8","52C7B8","0, 150, 136","E5F0EE","bfe1de")

          function Check-File($path, $label) {
            if (-not (Test-Path $path)) {
              Write-Host "WARNING: $label not found at $path"
              return
            }
            $content = Get-Content $path -Raw
            $hasTeal = $false
            foreach ($p in $tealPatterns) {
              if ($content -match [regex]::Escape($p)) {
                Write-Host "  TEAL '$p' found in $label"
                $hasTeal = $true
                $script:failed = $true
              }
            }
            if (-not $hasTeal) {
              Write-Host "OK: $label — no teal colors"
            }
          }

          Check-File "orcaslicer-source\src\slic3r\GUI\Widgets\Button.cpp"  "Button.cpp"
          Check-File "orcaslicer-source\src\slic3r\GUI\TabButton.cpp"        "TabButton.cpp"
          Check-File "orcaslicer-source\src\slic3r\GUI\Tabbook.cpp"          "Tabbook.cpp"
          Check-File "orcaslicer-source\src\slic3r\GUI\Plater.cpp"           "Plater.cpp"
          Check-File "orcaslicer-source\src\slic3r\GUI\MainFrame.cpp"        "MainFrame.cpp"

          # Broad scan: find ANY remaining teal in all cpp/hpp files
          Write-Host "`n=== Full scan for remaining teal in src/ ==="
          $remaining = Get-ChildItem "orcaslicer-source\src" -Recurse -Include "*.cpp","*.hpp","*.h" |
            Select-String -Pattern "009688|BFE1DE|52c7b8|0, 150, 136" -CaseSensitive:$false |
            Select-Object -First 30
          if ($remaining) {
            Write-Host "REMAINING TEAL occurrences (first 30):"
            $remaining | ForEach-Object { Write-Host "  $($_.Filename):$($_.LineNumber): $($_.Line.Trim())" }
            $failed = $true
          } else {
            Write-Host "No remaining teal found in src/ cpp/hpp files."
          }

          if ($failed) {
            Write-Host ""
            Write-Host "WARNING: Teal colors remain — PATCH 9 (binary EXE patch) will fix them in the final binary."
            Write-Host "Build continues. Check the log above for which files/patterns were found."
            # Non-fatal: PATCH 9 handles final color replacement directly in the compiled EXE.
          }

      # ── PATCH 4: Replace app icon ──────────────────────────────────────────
      - name: Apply Kentstrapper icons
        shell: pwsh
        run: |
          $imgDir = "orcaslicer-source\resources\images"
          Write-Host "Applying Kentstrapper icons..."

          # ICO file (already correct format — use directly)
          $icoSrc = "kentstrapper-patches\branding\logo.ico"
          if (Test-Path $icoSrc) {
            Copy-Item $icoSrc (Join-Path $imgDir "OrcaSlicer.ico") -Force
            Copy-Item $icoSrc (Join-Path $imgDir "OrcaSlicerTitle.ico") -Force
            Write-Host "  Replaced: OrcaSlicer.ico + OrcaSlicerTitle.ico"
          }

          # PNG icons — all standard sizes
          $pngSrc = "kentstrapper-patches\branding\logo.png"
          if (Test-Path $pngSrc) {
            foreach ($t in @("OrcaSlicer.png","OrcaSlicer_32px.png","OrcaSlicer_64.png","OrcaSlicer_128px.png","OrcaSlicer_192px.png","OrcaSlicerTitle.png")) {
              $dest = Join-Path $imgDir $t
              if (Test-Path $dest) {
                Copy-Item $pngSrc $dest -Force
                Write-Host "  Replaced PNG: $t"
              }
            }
          }

          # High-res 1024px icon
          $pngLarge = "kentstrapper-patches\branding\logo_1024.png"
          if (Test-Path $pngLarge) {
            Copy-Item $pngLarge (Join-Path $imgDir "OrcaSlicer_1024.png") -Force
            Write-Host "  Added: OrcaSlicer_1024.png"
          }

      # ── PATCH 5: Replace splash screen ────────────────────────────────────
      - name: Apply Kentstrapper splash screen
        shell: pwsh
        run: |
          $bg     = "kentstrapper-patches\branding\background.png"
          $imgDir = "orcaslicer-source\resources\images"

          if (-not (Test-Path $bg)) {
            Write-Host "No background.png found, skipping."
            exit 0
          }

          Write-Host "Applying Kentstrapper splash screen..."

          # Our patched GUI_App.cpp loads OrcaSlicer_154.png as the splash background
          # Replace it with the Kentstrapper custom image
          $dest = Join-Path $imgDir "OrcaSlicer_154.png"
          Copy-Item $bg $dest -Force
          Write-Host "  Replaced: OrcaSlicer_154.png (loaded by patched GUI_App.cpp)"

          # Also replace the title variant
          $dest2 = Join-Path $imgDir "OrcaSlicer_154_title.png"
          if (Test-Path $dest2) {
            Copy-Item $bg $dest2 -Force
            Write-Host "  Replaced: OrcaSlicer_154_title.png"
          }

      # ── PATCH 6: Installer branding text ──────────────────────────────────
      - name: Patch installer branding text
        shell: pwsh
        run: |
          Write-Host "Patching installer display name and branding..."

          # Patch CMakeLists.txt - change installer description
          $cmake = "orcaslicer-source\CMakeLists.txt"
          if (Test-Path $cmake) {
            $c = Get-Content $cmake -Raw
            $c = $c -replace 'set\(CPACK_PACKAGE_DESCRIPTION_SUMMARY\s+"[^"]*"\)', 'set(CPACK_PACKAGE_DESCRIPTION_SUMMARY "OrcaSlicer branded version by Kentstrapper")'
            $c = $c -replace 'set\(CPACK_NSIS_PACKAGE_NAME\s+"[^"]*"\)', 'set(CPACK_NSIS_PACKAGE_NAME "OrcaSlicer branded by Kentstrapper")'
            Set-Content $cmake $c
            Write-Host "  Patched CMakeLists.txt"
          }

          # Patch NSIS script template directly
          $nsiFiles = Get-ChildItem "orcaslicer-source" -Recurse -Filter "*.nsi"
          foreach ($nsi in $nsiFiles) {
            $c = Get-Content $nsi.FullName -Raw
            $c = $c -replace 'Name "OrcaSlicer"', 'Name "OrcaSlicer branded by Kentstrapper"'
            $c = $c -replace '!define PRODUCT_NAME "OrcaSlicer"', '!define PRODUCT_NAME "OrcaSlicer branded by Kentstrapper"'
            Set-Content $nsi.FullName $c
            Write-Host "  Patched NSI: $($nsi.Name)"
          }

      # ── PATCH 7: Pre-installed profiles ───────────────────────────────────
      - name: Include Kentstrapper profiles
        shell: pwsh
        run: |
          $profilesSrc = "kentstrapper-patches\profiles"
          if (-not (Test-Path $profilesSrc)) {
            Write-Host "No profiles/ folder, skipping."
            exit 0
          }
          Write-Host "Staging Kentstrapper profiles..."
          $dest = "orcaslicer-source\resources\kentstrapper_profiles"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item "$profilesSrc\*" $dest -Recurse -Force
          Write-Host "  Profiles staged at: $dest"

          $nsisScript = Get-ChildItem -Path "orcaslicer-source" -Recurse -Filter "*.nsi" | Select-Object -First 1
          if ($nsisScript) {
            $nsiContent = Get-Content $nsisScript.FullName -Raw
            $line1 = '              ; Kentstrapper pre-installed profiles'
            $line2 = '              SetOutPath "$APPDATA\OrcaSlicer\user\default"'
            $line3 = '              File /r "${RESOURCEDIR}\kentstrapper_profiles\*"'
            $inject = "`n$line1`n$line2`n$line3`n"
            $nsiContent = $nsiContent -replace '(?m)(SectionEnd[ \t]*)$', "$inject`n`$1"
            Set-Content $nsisScript.FullName $nsiContent
            Write-Host "  NSIS profiles injection patched."
          }

      # ── BUILD ─────────────────────────────────────────────────────────────
      - name: Install NSIS
        run: choco install nsis -y

      - name: Get version
        id: get_ver
        working-directory: orcaslicer-source
        shell: pwsh
        run: |
          $v = Get-Content version.inc -Raw
          if ($v -match 'set\(SoftFever_VERSION "(.*?)"\)') { $ver = $matches[1] }
          $sha = "${{ github.sha }}".Substring(0, 7)
          $ver = "V$ver-Kentstrapper-$sha"
          echo "ver=$ver" >> $env:GITHUB_ENV
          echo "sha_short=$sha" >> $env:GITHUB_ENV
          echo "date=$(Get-Date -Format 'yyyyMMdd-HHmm')" >> $env:GITHUB_ENV

      # ── PATCH 8: Inject Kentstrapper version into About dialog ───────────
      # Must run AFTER "Get version" so ${{ env.ver }} is set.
      - name: Inject Kentstrapper build version string
        shell: pwsh
        run: |
          python kentstrapper-patches\scripts\patch_version.py orcaslicer-source "${{ env.ver }}"

      - name: Build OrcaSlicer
        working-directory: orcaslicer-source
        env:
          WindowsSdkDir: 'C:\Program Files (x86)\Windows Kits\10\'
          WindowsSDKVersion: '10.0.26100.0\'
        shell: pwsh
        run: |
          .\build_release_vs.bat slicer 2>&1 | Tee-Object -FilePath ..\build_output.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== LAST 150 LINES OF BUILD OUTPUT (errors) ==="
            Get-Content ..\build_output.txt | Select-Object -Last 150
            exit 1
          }

      # ── PATCH 9: Binary-patch color strings directly in the compiled EXE ────
      # This is the DEFINITIVE approach: replace teal ASCII strings in the binary
      # regardless of compilation caching or any other source-patching issues.
      - name: Binary-patch EXE color strings
        shell: pwsh
        run: |
          function Patch-BinaryString($filePath, [string]$oldStr, [string]$newStr) {
            if ($oldStr.Length -ne $newStr.Length) {
              Write-Host "  SKIP length mismatch: '$oldStr'($($oldStr.Length)) vs '$newStr'($($newStr.Length))"
              return 0
            }
            $oldBytes = [System.Text.Encoding]::ASCII.GetBytes($oldStr)
            $newBytes = [System.Text.Encoding]::ASCII.GetBytes($newStr)
            $bytes = [System.IO.File]::ReadAllBytes($filePath)
            $count = 0
            for ($i = 0; $i -le $bytes.Length - $oldBytes.Length; $i++) {
              $match = $true
              for ($j = 0; $j -lt $oldBytes.Length; $j++) {
                if ($bytes[$i + $j] -ne $oldBytes[$j]) { $match = $false; break }
              }
              if ($match) {
                for ($j = 0; $j -lt $newBytes.Length; $j++) { $bytes[$i + $j] = $newBytes[$j] }
                $count++
                $i += $oldBytes.Length - 1
              }
            }
            if ($count -gt 0) { [System.IO.File]::WriteAllBytes($filePath, $bytes) }
            return $count
          }

          $replacements = @(
            @("#009688", "#FF8800"),
            @("#009688".ToUpper(), "#FF8800"),
            @("#26A69A", "#CC6E00"),
            @("#26a69a", "#cc6e00"),
            @("#BFE1DE", "#FFE0B2"),
            @("#bfe1de", "#ffe0b2"),
            @("#E5F0EE", "#FFF3E0"),
            @("#e5f0ee", "#fff3e0"),
            @("#52C7B8", "#FFAA33"),
            @("#52c7b8", "#ffaa33"),
            @("#22bfb0", "#FF9933"),
            @("#22BFBO", "#FF9933"),
            @("#00FFD4", "#FFAA44"),
            @("#00897B", "#CC6E00"),
            @("#D7E8DE", "#FFE8CC"),
            @("#EDFAF2", "#FFF8EE")
          )

          $exe = Get-ChildItem "orcaslicer-source\build" -Recurse -Filter "orca-slicer.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            Write-Host "ERROR: orca-slicer.exe not found!"
            Get-ChildItem "orcaslicer-source\build" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name)" }
            exit 1
          }

          Write-Host "Binary patching: $($exe.FullName) ($([int]([System.IO.FileInfo]$exe.FullName).Length / 1MB) MB)"
          $total = 0
          foreach ($pair in $replacements) {
            $n = Patch-BinaryString $exe.FullName $pair[0] $pair[1]
            if ($n -gt 0) {
              Write-Host "  '$($pair[0])' -> '$($pair[1])': $n hits"
              $total += $n
            }
          }
          Write-Host "Binary color patch complete: $total total replacements"

      - name: Create installer
        working-directory: orcaslicer-source/build
        run: cpack -G NSIS

      - name: Pack portable zip
        working-directory: orcaslicer-source/build
        shell: cmd
        run: '"C:/Program Files/7-Zip/7z.exe" a -tzip KentrapperSlicer_Windows_${{ env.ver }}_portable.zip OrcaSlicer'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: KentrapperSlicer_Windows_${{ env.ver }}_installer
          path: orcaslicer-source/build/OrcaSlicer*.exe

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: KentrapperSlicer_Windows_${{ env.ver }}_portable
          path: orcaslicer-source/build/KentrapperSlicer_Windows_${{ env.ver }}_portable.zip

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.create-release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kentstrapper-${{ env.ver }}-${{ env.date }}
          name: "Kentstrapper OrcaSlicer ${{ env.ver }} (${{ env.date }})"
          body: |
            ## OrcaSlicer branded version by Kentstrapper — ${{ env.ver }}

            OrcaSlicer **v2.3.2 stabile** rebranded con i colori aziendali Kentstrapper.

            ### Download
            - **Installer** (`.exe`) — consigliato, include profili pre-installati
            - **Portable** (`.zip`) — nessuna installazione, decomprimi e avvia

            ### Incluso
            - Colori arancione Kentstrapper #FF8800 in tutta la UI
            - Icona e splash screen Kentstrapper
            - Profili filament/machine/process pre-installati
            - **Hole wall loops**: numero di pareti indipendente per i fori interni
            - **Supporti misti per regione**: dipingi zone con "Grid" per supporti normali e "Organic" per supporti ad albero sullo stesso pezzo
          draft: false
          prerelease: false
          files: |
            orcaslicer-source/build/OrcaSlicer*.exe
            orcaslicer-source/build/KentrapperSlicer_Windows_${{ env.ver }}_portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
