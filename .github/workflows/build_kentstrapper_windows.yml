name: Build Kentstrapper OrcaSlicer (Windows)

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/build_kentstrapper_windows.yml'

  workflow_dispatch:
    inputs:
      create-release:
        description: 'Create a GitHub Release after build'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build_windows:
    name: Build Kentstrapper OrcaSlicer (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Kentstrapper patches
        uses: actions/checkout@v4
        with:
          path: kentstrapper-patches

      - name: Clone OrcaSlicer v2.3.2 (stable)
        run: git clone --depth 1 --branch v2.3.2 https://github.com/SoftFever/OrcaSlicer.git orcaslicer-source

      - name: Get OrcaSlicer commit SHA (for cache key)
        id: orca_sha
        working-directory: orcaslicer-source
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          echo "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Cache OrcaSlicer dependencies
        id: cache_deps
        uses: actions/cache@v4
        with:
          path: orcaslicer-source/deps/build/OrcaSlicer_dep
          key: windows-orcaslicer-deps-${{ steps.orca_sha.outputs.sha }}

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.3.0"
          useLocalCache: true
          useCloudCache: true

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Build dependencies (only if not cached)
        if: steps.cache_deps.outputs.cache-hit != 'true'
        working-directory: orcaslicer-source
        run: .\build_release_vs.bat deps

      - name: Apply Kentstrapper branding — global color replacement
        shell: python
        run: |
          import os

          # Teal → Orange color map (all variants found in OrcaSlicer source)
          replacements = [
              # Primary accent teal → Kentstrapper orange
              ("#009688", "#FF8800"),
              ("#009688".lower(), "#ff8800"),
              ("009688", "FF8800"),
              ("0x009688", "0xFF8800"),
              # Hover teal → hover orange
              ("#26A69A", "#CC6E00"),
              ("#26a69a", "#cc6e00"),
              ("26A69A", "CC6E00"),
              ("26a69a", "cc6e00"),
              ("0x26A69A", "0xCC6E00"),
              # Hover+checked teal → hover+checked orange
              ("0x52c7b8", "0xFFAA33"),
              ("52c7b8", "FFAA33"),
              ("52C7B8", "FFAA33"),
              # Dark mode teal → dark mode orange
              ("#00675b", "#CC6E00"),
              ("#00675B", "#CC6E00"),
              ("00675b", "CC6E00"),
              ("00675B", "CC6E00"),
              # Confirm hover teal → confirm hover orange
              ("22bfb0", "FF9933"),
              ("22BFB0", "FF9933"),
              ("00FFD4", "FFAA44"),
              # Light teal tints → light orange tints
              ("BFE1DE", "FFE0B2"),
              ("bfe1de", "ffe0b2"),
              ("E5F0EE", "FFF3E0"),
              ("e5f0ee", "fff3e0"),
              ("EDFAF2", "FFF8EE"),
              ("edfaf2", "fff8ee"),
              ("EBF9F0", "FFF8EE"),
              ("ebf9f0", "fff8ee"),
              ("D7E8DE", "FFE8CC"),
              ("d7e8de", "ffe8cc"),
              ("DBFDD5", "FFE8CC"),
              # RGB values
              ("0, 150, 136", "255, 136, 0"),
              ("0,150,136",   "255,136,0"),
          ]

          exts = {'.cpp', '.hpp', '.h', '.cxx', '.c', '.svg', '.xml', '.json', '.inc'}
          search_dirs = [
              os.path.join('orcaslicer-source', 'src'),
              os.path.join('orcaslicer-source', 'resources'),
          ]

          total = 0
          for search_dir in search_dirs:
              for root, dirs, files in os.walk(search_dir):
                  for fname in files:
                      if os.path.splitext(fname)[1].lower() not in exts:
                          continue
                      fpath = os.path.join(root, fname)
                      try:
                          with open(fpath, 'r', encoding='utf-8', errors='ignore') as f:
                              content = f.read()
                          original = content
                          for old, new in replacements:
                              content = content.replace(old, new)
                          if content != original:
                              with open(fpath, 'w', encoding='utf-8') as f:
                                  f.write(content)
                              total += 1
                              print(f"Patched: {fpath}")
                      except Exception as e:
                          print(f"  SKIP {fpath}: {e}")
          print(f"\nTotal files patched: {total}")

      - name: Install NSIS
        run: choco install nsis -y

      - name: Get version
        id: get_ver
        working-directory: orcaslicer-source
        shell: pwsh
        run: |
          $versionContent = Get-Content version.inc -Raw
          if ($versionContent -match 'set\(SoftFever_VERSION "(.*?)"\)') { $ver = $matches[1] }
          $ver = "V$ver-Kentstrapper"
          echo "ver=$ver" >> $env:GITHUB_ENV
          echo "date=$(Get-Date -Format 'yyyyMMdd')" >> $env:GITHUB_ENV

      - name: Build OrcaSlicer
        working-directory: orcaslicer-source
        env:
          WindowsSdkDir: 'C:\Program Files (x86)\Windows Kits\10\'
          WindowsSDKVersion: '10.0.26100.0\'
        run: .\build_release_vs.bat slicer

      - name: Create installer
        working-directory: orcaslicer-source/build
        run: cpack -G NSIS

      - name: Pack portable zip
        working-directory: orcaslicer-source/build
        shell: cmd
        run: '"C:/Program Files/7-Zip/7z.exe" a -tzip KentrapperSlicer_Windows_${{ env.ver }}_portable.zip OrcaSlicer'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: KentrapperSlicer_Windows_${{ env.ver }}_installer
          path: orcaslicer-source/build/OrcaSlicer*.exe

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: KentrapperSlicer_Windows_${{ env.ver }}_portable
          path: orcaslicer-source/build/KentrapperSlicer_Windows_${{ env.ver }}_portable.zip

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.create-release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kentstrapper-${{ env.ver }}-${{ env.date }}
          name: "Kentstrapper OrcaSlicer ${{ env.ver }} (${{ env.date }})"
          body: |
            ## Kentstrapper OrcaSlicer ${{ env.ver }} — Windows Build

            OrcaSlicer **v2.3.2 stabile** rebranded con i colori aziendali Kentstrapper.

            ### Download
            - **Installer** (`.exe`) — consigliato, installa automaticamente le dipendenze
            - **Portable** (`.zip`) — nessuna installazione, decomprimi e avvia

            ### Modifiche rispetto a OrcaSlicer ufficiale
            - Colore accent: teal `#009688` → arancione Kentstrapper `#FF8800` (applicato su tutti i file sorgente)
            - Tutti i toni teal/verde sostituiti con arancione e varianti
            - Mappatura dark mode aggiornata
          draft: false
          prerelease: false
          files: |
            orcaslicer-source/build/OrcaSlicer*.exe
            orcaslicer-source/build/KentrapperSlicer_Windows_${{ env.ver }}_portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
